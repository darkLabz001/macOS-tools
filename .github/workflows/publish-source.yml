name: Publish source folders
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Expand audited source package
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('macOS-tools-source.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'f9725925605de89c7cbe584d19c67102e236f8031b984a347046829a9c4c3f18'
          with zipfile.ZipFile(archive) as package:
              for entry in package.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  assert path.parts[0] == 'macOS-tools' and '..' not in path.parts
                  assert (entry.external_attr >> 16) & 0o170000 != 0o120000
                  if entry.is_dir():
                      continue
                  target = pathlib.Path(*path.parts[1:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(package.read(entry))
          pathlib.Path('docs').mkdir(exist_ok=True)
          for name in ['SANITIZATION.md', 'THIRD_PARTY_NOTICES.md']:
              pathlib.Path(name).replace(pathlib.Path('docs') / name)
          readme = pathlib.Path('README.md')
          content = readme.read_text()
          for name in ['SANITIZATION.md', 'THIRD_PARTY_NOTICES.md']:
              content = content.replace('](' + name + ')', '](docs/' + name + ')')
          readme.write_text(content)
          for name in ['macOS-tools-source.zip', 'SHA256SUMS.txt', 'LICENSE.txt']:
              pathlib.Path(name).unlink()
          pathlib.Path('.github/workflows/publish-source.yml').unlink()
      - name: Verify sanitized source
        run: python3 scripts/audit-source.py
      - name: Commit source folders
        run: |
          git config user.name 'macOS-tools'
          git config user.email 'source@users.noreply.github.com'
          git add -A
          git commit -m 'Publish tool source folders'
          git push
